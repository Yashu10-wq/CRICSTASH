spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:cricket_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: CricketScoreSuperSecretKeyWithMinimum256BitsLengthForHmacSha256Security123456
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    root: WARN
    com.cricketscore: INFO
